plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}

loom {
    runs {
        client {
            runDir 'run-26.3'
            // SHaRC's shader-only SDK expands to a large GLSL translation unit.
            vmArg '-Dorg.lwjgl.system.stackSize=8192'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "maven.modrinth:fabric-api:${project.fabric_version}"
    implementation "maven.modrinth:sodium:${project.sodium_version}"
    implementation "maven.modrinth:iris:${project.iris_version}"

    compileOnly "org.lwjgl:lwjgl-glfw:${project.lwjgl_version}"
    implementation platform("org.lwjgl:lwjgl-bom:${project.lwjgl_version}")
    include(implementation("org.lwjgl:lwjgl-meshoptimizer:${project.lwjgl_version}"))
    def nativePlatform = System.getProperty('os.name').toLowerCase().contains('win') ? 'natives-windows' : 'natives-linux'
    include(runtimeOnly("org.lwjgl:lwjgl-meshoptimizer:${project.lwjgl_version}:${nativePlatform}"))
    // Minecraft 26.3 supplies the Vulkan, VMA, shaderc, SPVC and core LWJGL modules.
    implementation "org.joml:joml:${project.joml_version}"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') { expand version: project.version }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }
publishing { publications { mavenJava(MavenPublication) { from components.java } } }
