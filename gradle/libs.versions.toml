[versions]
foojay = "1.0.0"
google-java-format = "1.36.1"
junit = "6.1.3"
ktfmt = "0.65"
loom = "1.18.3"
lwjgl = "3.4.3"
joml = "1.10.9"
moddev = "2.0.148"
rumdl = "0.2.78"
spotless = "8.10.4"
tomlj = "2.2.0"

[libraries]
foojay-plugin = { module = "org.gradle.toolchains:foojay-resolver", version.ref = "foojay" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
loom-plugin = { module = "net.fabricmc:fabric-loom", version.ref = "loom" }
lwjgl-bom = { module = "org.lwjgl:lwjgl-bom", version.ref = "lwjgl" }
lwjgl-glfw = { module = "org.lwjgl:lwjgl-glfw" }
lwjgl-meshoptimizer = { module = "org.lwjgl:lwjgl-meshoptimizer", version.ref = "lwjgl" }
joml = { module = "org.joml:joml", version.ref = "joml" }
moddev-plugin = { module = "net.neoforged:moddev-gradle", version.ref = "moddev" }
spotless-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
tomlj = { module = "org.tomlj:tomlj", version.ref = "tomlj" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
